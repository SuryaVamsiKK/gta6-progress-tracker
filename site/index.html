<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida 100% Tracker</title>
<meta name="description" content="Unofficial fan-made GTA VI progression tracker: 100% checklist, story missions, collectibles, challenges, regions and trophies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23ffb38a'/><stop offset='1' stop-color='%23ff6fae'/></linearGradient></defs><circle cx='32' cy='32' r='30' fill='url(%23g)'/><text x='32' y='43' font-family='Arial Black,Arial' font-weight='900' font-size='30' text-anchor='middle' fill='%2318122a'>L</text></svg>">
</head>
<body>
  <!-- Ambient background -->
  <div class="sky" aria-hidden="true">
    <div class="sky-glow"></div>
    <div class="sun"></div>
    <svg class="palms" viewBox="0 0 900 600" preserveAspectRatio="xMaxYMax meet"><use href="#palm" x="420" y="40" width="300" height="560"/><use href="#palm" x="600" y="140" width="260" height="460" transform="scale(-1,1) translate(-1460,0)"/><use href="#palm" x="250" y="230" width="190" height="370"/></svg>
    <div class="grain"></div>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffd36e"/><stop offset=".45" stop-color="#ff7eb6"/><stop offset="1" stop-color="#a24f93"/>
      </linearGradient>
      <symbol id="palm" viewBox="0 0 200 400">
        <path fill="currentColor" d="M98 395c-2-70 2-150 12-215l7 1c-9 66-12 146-10 214z"/>
        <g fill="currentColor">
          <path d="M112 182c-20-30-55-40-95-28 30-4 60 6 82 32z"/>
          <path d="M112 182c-10-40-40-62-80-66 34 10 56 32 70 68z"/>
          <path d="M113 181c5-38-8-70-36-92 22 26 30 56 28 92z"/>
          <path d="M114 181c18-34 46-50 82-48-34 6-58 22-76 52z"/>
          <path d="M114 182c30-18 62-16 86 6-28-14-56-12-82 0z"/>
          <path d="M113 183c22 8 40 30 46 62-12-28-30-46-50-56z"/>
          <path d="M112 183c-22 6-40 26-50 58 14-26 32-44 54-52z"/>
          <path d="M113 181c-8-30 0-62 22-86-14 28-18 56-14 86z"/>
        </g>
      </symbol>
      <symbol id="star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></symbol>
    </defs>
  </svg>

  <!-- Title screen -->
  <section id="intro" class="intro" aria-label="Title screen">
    <div class="intro-inner">
      <p class="script intro-welcome">Welcome to</p>
      <h1 class="intro-title" aria-label="Leonida"><span>L</span><span>E</span><span>O</span><span>N</span><span>I</span><span>D</span><span>A</span></h1>
      <p class="intro-sub">100% Progression Tracker</p>
      <div class="intro-pct"><span id="introPct">0%</span> complete</div>
      <button class="pill pill-lg" id="startBtn">Press Start <kbd>Enter</kbd></button>
    </div>
    <div class="intro-road" aria-hidden="true"></div>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="brand" data-go="hq" title="Back to HQ">
        <span class="brand-mark">L</span>
        <span class="brand-text"><b>Leonida</b><small>100% Tracker</small></span>
      </button>

      <nav class="tabs" aria-label="Sections">
        <button class="kbd-hint" id="prevTab" title="Previous tab (Q)">LB</button>
        <div class="tab-strip" id="tabStrip" role="tablist"></div>
        <button class="kbd-hint" id="nextTab" title="Next tab (E)">RB</button>
      </nav>

      <div class="hud">
        <div class="wanted" id="hudStars" title="Your wanted level grows with completion"></div>
        <div class="hud-pct"><b id="hudPct">0%</b><small id="hudRank">Fresh off the Keys</small></div>
        <button class="icon-btn" id="sfxBtn" title="Toggle sound effects" aria-pressed="true">♪</button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="footbar">
      <div class="foot-keys">
        <span><kbd>Q</kbd><kbd>E</kbd> Switch tab</span>
        <span><kbd>1</kbd>–<kbd>8</kbd> Jump</span>
        <span><kbd>Esc</kbd> Title screen</span>
      </div>
      <div class="foot-note">Unofficial fan project. Not affiliated with Rockstar Games. Progress saves in this browser.</div>
    </footer>
  </div>

  <!-- Completion banner -->
  <div id="banner" class="banner" aria-live="polite"><div class="banner-band"><div class="banner-title" id="bannerTitle"></div><div class="banner-sub" id="bannerSub"></div></div></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
